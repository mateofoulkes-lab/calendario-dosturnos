      // =====================================================
      // SETTINGS (persistentes vía localStorage)
      // =====================================================
      const LS_KEY = "tresturnCalendarSettings.v2";
      const DEFAULT_SETTINGS = {
        selectedTeam: "A",
        reverseRotation: false,
        showInamovible: true,
        showTrasladable: true,
        showNoLaborable: true,
        showTuristico: true,
        showRegional: true,
      };
      let SETTINGS = loadSettings();

      function loadSettings() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          const stored = raw ? JSON.parse(raw) : {};
          return {
            ...DEFAULT_SETTINGS,
            ...stored,
            selectedTeam: ["A", "B", "C"].includes(stored.selectedTeam) ? stored.selectedTeam : "A",
            reverseRotation: stored.reverseRotation === true
          };
        } catch { return { ...DEFAULT_SETTINGS }; }
      }
      function saveSettings() {
        localStorage.setItem(LS_KEY, JSON.stringify(SETTINGS));
      }

      function applySettingsToUI() {
        // checkboxes
        document.getElementById("opt-reverse").checked = SETTINGS.reverseRotation;
        document.getElementById("team-select").value = SETTINGS.selectedTeam;
        document.getElementById("opt-inamovible").checked = SETTINGS.showInamovible;
        document.getElementById("opt-trasladable").checked = SETTINGS.showTrasladable;
        document.getElementById("opt-nolaborable").checked = SETTINGS.showNoLaborable;
        document.getElementById("opt-turistico").checked = SETTINGS.showTuristico;
        document.getElementById("opt-regional").checked = SETTINGS.showRegional;

        // leyenda (atenúa cuando está oculto)
        document.querySelector('[data-legend="inamovible"]').classList.toggle("opacity-40", !SETTINGS.showInamovible);
        document.querySelector('[data-legend="trasladable"]').classList.toggle("opacity-40", !SETTINGS.showTrasladable);
        document.querySelector('[data-legend="no-laborable"]').classList.toggle("opacity-40", !SETTINGS.showNoLaborable);
        document.querySelector('[data-legend="turistico"]').classList.toggle("opacity-40", !SETTINGS.showTuristico);
        document.querySelector('[data-legend="regional"]').classList.toggle("opacity-40", !SETTINGS.showRegional);
      }

      function isCategoryEnabled(type) {
        switch (type) {
          case "inamovible":   return SETTINGS.showInamovible;
          case "trasladable":  return SETTINGS.showTrasladable;
          case "no-laborable": return SETTINGS.showNoLaborable;
          case "turistico":    return SETTINGS.showTuristico;
          case "regional":     return SETTINGS.showRegional;
          default: return true;
        }
      }

      // =====================================================
      // FECHAS helpers
      // =====================================================
      const today = new Date();
      let currentMonth = today.getMonth();
      let currentYear = today.getFullYear();
      const MS_DAY = 24 * 60 * 60 * 1000;

      const atMidnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
      function startOfISOWeek(d) {
        const date = atMidnight(d);
        const day = (date.getDay() + 6) % 7; // lunes=0
        return new Date(date.getFullYear(), date.getMonth(), date.getDate() - day);
      }
      // Fechas civiles en UTC para evitar el desfasaje del horario de verano.
      const utcDay = d => Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / MS_DAY;
      const weeksBetween = (a,b) => Math.round((utcDay(a) - utcDay(b)) / 7);

      // El equipo seleccionado tiene un único turno por semana.
      // Semana de referencia (26/10/2026): A mañana, B tarde, C noche.
      // Por defecto: mañana → tarde → noche → mañana.
      function effectiveShiftForDate(d) {
        const shifts = ["mañana", "tarde", "noche"];
        const teamOffset = { A: 0, B: 1, C: 2 }[SETTINGS.selectedTeam] ?? 0;
        const weeks = weeksBetween(startOfISOWeek(d), startOfISOWeek(ANCHOR_DATE));
        const direction = SETTINGS.reverseRotation ? -1 : 1;
        const shiftIndex = ((teamOffset + weeks * direction) % 3 + 3) % 3;
        return shifts[shiftIndex];
      }

      function dateToISO(d) {
        const m = (d.getMonth()+1).toString().padStart(2,"0");
        const day = d.getDate().toString().padStart(2,"0");
        return `${d.getFullYear()}-${m}-${day}`;
      }
      function getSpecialForYear(year) { return SPECIAL_DAYS[year] || []; }
      function specialInfo(date) {
        const iso = dateToISO(date);
        const priority = {inamovible: 0, regional: 1, trasladable: 2, turistico: 3, "no-laborable": 4};
        return getSpecialForYear(date.getFullYear())
          .filter(x => x.date === iso && isCategoryEnabled(x.type))
          .sort((a,b) => priority[a.type] - priority[b.type]);
      }

      // =====================================================
      // Semanas del mes
      // =====================================================
      function getWeeksInMonth(year, month) {
        const first = new Date(year, month, 1);
        const last = new Date(year, month + 1, 0);
        let cursor = startOfISOWeek(first);
        const endGuard = new Date(last.getFullYear(), last.getMonth(), last.getDate() + 7);
        const weeks = [];
        while (cursor <= endGuard) {
          const days = [];
          for (let i = 0; i < 7; i++) days.push(new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + i));
          weeks.push({ days, shift: effectiveShiftForDate(cursor) });
          cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + 7);
          if (days[0] > last && days.some(d => d.getMonth() !== month)) break;
        }
        return weeks.filter(w => w.days.some(d => d.getMonth() === month));
      }

      // =====================================================
      // Render
      // =====================================================
      function renderMonthPicker(month, year) {
        const select = document.getElementById("month-select");
        select.innerHTML = "";
        for (let i = 0; i < 12; i++) {
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = new Date(year, i).toLocaleString("es-ES", { month: "long" });
          if (i === month) opt.selected = true;
          select.appendChild(opt);
        }
      }

      function renderCalendar(month, year) {
        const body = document.getElementById("calendar-body");
        const label = document.getElementById("month-label");
        label.textContent = new Date(year, month).toLocaleString("es-ES", { month: "long", year: "numeric" });
        body.innerHTML = "";
        renderMonthPicker(month, year);
        document.getElementById("feriados-nota").textContent = year === 2027
          ? "2027: días turísticos por confirmar; traslado del 20/11 aún no definido (? en el calendario)."
          : "Los feriados no modifican automáticamente los turnos asignados.";

        const weeks = getWeeksInMonth(year, month);
        weeks.forEach(week => {
          const row = document.createElement("tr");

          for (let i = 0; i < 7; i++) {
            const cell = document.createElement("td");
            cell.className = COLORS.cellBase;

            const day = week.days[i];
            const inMonth = day.getMonth() === month;
            const isToday = atMidnight(day).getTime() === atMidnight(today).getTime();

            // número (siempre mostramos número)
            const number = document.createElement("div");
            number.className = "text-[11px] sm:text-sm font-semibold inline-flex items-center justify-center w-6 h-6 sm:w-7 sm:h-7 mx-auto rounded-full";
            number.textContent = day.getDate();

            if (inMonth) {
              const turno = week.shift; // "mañana" | "tarde" | "noche"
              const isWeekend = (i === 5 || i === 6);
              let painted = false;

              // La noche se marca solo en su fecha de ingreso (22:00).
              if (turno === "mañana") {
                if (i <= 5) { cell.classList.add(COLORS.cellA); painted = true; }
              } else if (turno === "tarde") {
                if (i <= 4) { cell.classList.add(COLORS.cellB); painted = true; }
              } else {
                if (i <= 4) { cell.classList.add(COLORS.cellC); number.classList.add("text-white"); painted = true; }
              }

              // Fin de semana fuera de alcance del turno → "Día franco"
              if (!painted && isWeekend) {
                cell.classList.add(COLORS.franco);
                cell.title = "Día franco";
              }
            } else {
              // Fuera de mes
              cell.classList.add(COLORS.outBg);
              number.classList.add(COLORS.outText);
            }

            // Feriados/no laborables → círculo relleno + borde propio + tooltip (según filtros)
            const specials = specialInfo(day);
            const special = specials[0] || null;
            if (inMonth && special) {
              const style = SPECIAL_STYLES[special.type] || SPECIAL_STYLES.inamovible;
              number.classList.remove("text-white"); // Un feriado usa el color de texto de su propio círculo.
              number.classList.add(style.bg, style.border, style.text, "border-2");
              const labels = specials.map(x => x.label + (x.pending ? " (PENDIENTE)" : "")).join(" · ");
              if (cell.title) cell.title += " · " + labels;
              else cell.title = labels;
              if (specials.some(x => x.pending)) number.textContent = day.getDate() + "?";
            }

            // “Hoy” → borde del turno; si además es especial, mantiene el relleno y cambia el borde al del turno
            if (isToday) {
              const turnoHoy = effectiveShiftForDate(day);
              if (special) {
                const st = SPECIAL_STYLES[special.type] || {};
                if (st.border) number.classList.remove(st.border);
              }
              number.classList.add("border-2", turnoHoy === "mañana" ? COLORS.borderA : turnoHoy === "tarde" ? COLORS.borderB : COLORS.borderC);
            }

            cell.appendChild(number);
            cell.addEventListener("click", () => showFlash(day));
            row.appendChild(cell);
          }
          body.appendChild(row);
        });

        // actualizar leyenda según settings
        applySettingsToUI();
      }

      function showFlash(date) {
        const turno = effectiveShiftForDate(date);
        const specials = specialInfo(date);
        const box = document.getElementById("message");
        let extra = "";

        // “Día franco” si es fin de semana fuera del alcance del turno
        const i = (atMidnight(date).getDay() + 6) % 7; // 0..6 (lun..dom)
        const turnoSemana = effectiveShiftForDate(startOfISOWeek(date));
        let esFranco = false;
        if (turnoSemana === "mañana") esFranco = (i === 6);
        else esFranco = (i === 5 || i === 6);

        if (esFranco) extra = " · Día franco";
        if (specials.length) extra += " · " + specials.map(x => x.label + (x.pending ? " (PENDIENTE)" : "")).join(" · ");

        box.textContent = `${date.toLocaleDateString("es-AR")} · Turno ${turno}${extra}`;
        box.classList.remove("opacity-0", COLORS.flashA, COLORS.flashB, COLORS.flashC);
        box.classList.add(turno === "mañana" ? COLORS.flashA : turno === "tarde" ? COLORS.flashB : COLORS.flashC, "opacity-100");
        clearTimeout(box._t);
        box._t = setTimeout(() => {
          box.classList.remove("opacity-100", COLORS.flashA, COLORS.flashB, COLORS.flashC);
          box.classList.add("opacity-0");
        }, 3000);
      }

      // =====================================================
      // Controles + Menú de opciones (FIX: toggle 'hidden')
      // =====================================================
      document.getElementById("prev-month").onclick = () => {
        if (--currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendar(currentMonth, currentYear);
      };
      document.getElementById("next-month").onclick = () => {
        if (++currentMonth > 11) { currentMonth = 0; currentYear++; }
        renderCalendar(currentMonth, currentYear);
      };
      document.getElementById("month-select").onchange = e => {
        currentMonth = parseInt(e.target.value, 10);
        renderCalendar(currentMonth, currentYear);
      };
      document.getElementById("go-today").onclick = () => {
        currentMonth = today.getMonth();
        currentYear = today.getFullYear();
        renderCalendar(currentMonth, currentYear);
        showFlash(today);
      };

      const gearBtn = document.getElementById("open-menu");
      const menu = document.getElementById("menu");
      gearBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const open = menu.classList.toggle("hidden"); // toggle devuelve si quedó oculto
        gearBtn.setAttribute("aria-expanded", (!open).toString());
      });
      document.addEventListener("click", (e) => {
        if (!menu.contains(e.target) && e.target !== gearBtn) {
          menu.classList.add("hidden");
          gearBtn.setAttribute("aria-expanded", "false");
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          menu.classList.add("hidden");
          gearBtn.setAttribute("aria-expanded", "false");
        }
      });

      // Eventos de checkboxes
      const onChangeSaveRerender = () => { saveSettings(); renderCalendar(currentMonth, currentYear); };

      document.getElementById("team-select").addEventListener("change", (e) => {
        SETTINGS.selectedTeam = ["A", "B", "C"].includes(e.target.value) ? e.target.value : "A";
        onChangeSaveRerender();
      });
      document.getElementById("opt-reverse").addEventListener("change", (e) => {
        SETTINGS.reverseRotation = e.target.checked; onChangeSaveRerender();
      });
      document.getElementById("opt-inamovible").addEventListener("change", (e) => {
        SETTINGS.showInamovible = e.target.checked; onChangeSaveRerender();
      });
      document.getElementById("opt-trasladable").addEventListener("change", (e) => {
        SETTINGS.showTrasladable = e.target.checked; onChangeSaveRerender();
      });
      document.getElementById("opt-nolaborable").addEventListener("change", (e) => {
        SETTINGS.showNoLaborable = e.target.checked; onChangeSaveRerender();
      });
      document.getElementById("opt-turistico").addEventListener("change", (e) => {
        SETTINGS.showTuristico = e.target.checked; onChangeSaveRerender();
      });
      document.getElementById("opt-regional").addEventListener("change", (e) => {
        SETTINGS.showRegional = e.target.checked; onChangeSaveRerender();
      });

      // Init
      renderCalendar(currentMonth, currentYear);
    });
  </script>
</head>

    <!-- Leyenda compacta -->
<!-- Agregar referencias de turno mañana/tarde a la derecha -->
